<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ka9q-web instrument</title>
<style>
/* Design system adopted from the approved instrument-UI mockup
   (ka9q-web-instrument-mockup.html) - colours, type, and the segment+
   popover interaction pattern are taken close to verbatim; only real
   data and only features this build actually implements are wired to
   it (see INSTRUMENT-DECISIONS.md - features not yet built are left
   absent here rather than shown as inert controls). */
:root{
  --ink:#0B0E13; --panel:#151A22; --panel-2:#1C232D; --panel-3:#232C38;
  --rule:#2A3441; --text:#C9D4E0; --dim:#78879A;
  --phosphor:#4BE08A; --signal:#FF9E3D; --live:#56C7FF; --danger:#FF5C6E;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}

#app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column}
#display-area{display:block;flex:1 1 0;min-height:0;width:100%;background:#04060A;cursor:crosshair}
#display-area canvas{display:block}
#dockslot{flex:0 0 auto;display:flex;padding:9px 10px;background:var(--panel);border-top:1px solid var(--rule);justify-content:center}

.silk{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.glass{
  background:rgba(11,14,19,.82);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(120,135,154,.22);border-radius:var(--r);
}

#instrument{display:flex;align-items:stretch;overflow:visible}
.sgm{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 13px 8px;cursor:pointer;position:relative;
  border-right:1px solid rgba(120,135,154,.16);
}
.sgm:last-child{border-right:none}
.sgm:hover{background:rgba(86,199,255,.10)}
.sgm .cap{font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.sgm:hover .cap{color:var(--live)}
.sgm .val{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);line-height:1.05}
.sgm .val.sm{font-size:13px}
.sgm.freq{padding:5px 12px;cursor:default}
.sgm.freq:hover{background:none}
.sgm .minibar{width:82px;height:5px;background:var(--ink);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.sgm .minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--phosphor) 0 62%,var(--signal) 62% 84%,var(--danger) 84% 100%)}

.digits{display:flex;align-items:stretch}
.digits .d{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:2px;position:relative}
.digits .d .num{font-family:var(--mono);font-weight:600;font-size:32px;line-height:1;padding:0 1.5px;color:var(--phosphor);text-shadow:0 0 16px rgba(75,224,138,.32)}
.digits .d.lead .num{color:#1F4A34;text-shadow:none}
.digits .d .ar{font-size:7px;line-height:7px;height:7px;color:var(--live);opacity:0;pointer-events:none;transition:opacity .1s}
.digits .d:hover .ar{opacity:.35}
.digits .d:hover .num{color:#fff}
.digits .d.up{background:linear-gradient(180deg,rgba(86,199,255,.20),transparent 60%)}
.digits .d.dn{background:linear-gradient(0deg,rgba(86,199,255,.20),transparent 60%)}
.digits .d.up .ar.u,.digits .d.dn .ar.d{opacity:1}
.digits .sep{font-family:var(--mono);font-size:32px;line-height:1;color:#2C6647;padding:0 1px;align-self:center}
.digits .unit{font-size:9px;font-weight:700;letter-spacing:.15em;color:var(--dim);padding:0 0 4px 7px;align-self:flex-end}
.freq-entry{
  font-family:var(--mono);font-size:28px;font-weight:600;color:var(--phosphor);
  background:#05070A;border:1px solid var(--live);border-radius:2px;
  width:210px;text-align:center;padding:2px 6px;
}

.spin{display:flex;flex-direction:column;margin-left:12px;gap:1px;align-self:center}
.spin button{border:1px solid var(--rule);background:rgba(35,44,56,.75);color:var(--text);cursor:pointer;border-radius:2px;padding:0;font-family:var(--ui)}
.spin .sar{height:15px;font-size:9px;line-height:1;color:var(--dim)}
.spin .sar:hover{background:var(--live);border-color:var(--live);color:var(--ink)}
.spin .sval{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:3px 8px;color:var(--live);border-color:#2E4A5C;min-width:64px;white-space:nowrap}
.spin .sval::after{content:' ▾';font-size:8px;color:var(--dim)}
.spin .sval:hover{background:rgba(86,199,255,.14)}

.value-panel.glass{position:absolute;z-index:40;min-width:214px;box-shadow:0 20px 50px rgba(0,0,0,.65);overflow:hidden}
.value-panel::before{
  content:'';position:absolute;left:var(--caret,50%);margin-left:-5px;width:9px;height:9px;
  background:rgba(11,14,19,.88);transform:rotate(45deg);
}
.value-panel.below::before{top:-5px;border-left:1px solid rgba(120,135,154,.22);border-top:1px solid rgba(120,135,154,.22)}
.value-panel.above::before{bottom:-5px;border-right:1px solid rgba(120,135,154,.22);border-bottom:1px solid rgba(120,135,154,.22)}
.pop-head{padding:8px 13px 7px;border-bottom:1px solid rgba(120,135,154,.16);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--live);display:flex;justify-content:space-between;gap:12px}
.pop-head span:last-child{color:var(--dim);font-weight:600}
.pop-body{padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px}
.foot{padding:7px 13px;border-top:1px solid rgba(120,135,154,.16);font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
.foot b{color:var(--text);font-weight:600;font-family:var(--mono)}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--text);background:rgba(35,44,56,.8);border:1px solid var(--rule);border-radius:2px;padding:5px 9px;cursor:pointer;min-width:44px;text-align:center}
.chip:hover{border-color:var(--live);color:#fff}
.chip.on{background:var(--live);border-color:var(--live);color:var(--ink);font-weight:600}

.memlist{display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto}
.mem{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:5px 7px;border-radius:2px;cursor:pointer;font-size:11.5px}
.mem:hover{background:rgba(86,199,255,.10)}
.mem.on{background:rgba(86,199,255,.16)}
.mem .n{font-family:var(--mono);color:var(--dim)}
.mem .f{font-family:var(--mono);color:var(--phosphor)}
.mem .m{font-size:10px;color:var(--dim);letter-spacing:.08em}

.prow{display:flex;align-items:center;gap:8px}
button.k,input.k{font-family:var(--ui);font-size:12px;color:var(--text);background:var(--panel-3);border:1px solid var(--rule);border-radius:var(--r);padding:5px 10px;cursor:pointer}
button.k:hover{border-color:var(--live);color:#fff}
button.k.mini{padding:3px 7px;font-size:11px}
input.k{font-family:var(--mono);background:var(--ink);cursor:auto;padding:4px 7px}
input.k.num{width:64px;text-align:right}
input.k:focus,button.k:focus-visible,.chip:focus-visible{outline:2px solid var(--live);outline-offset:1px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.chk input{accent-color:var(--live);margin:0}
.pop-body input[type=range],.bd input[type=range]{accent-color:var(--live)}
#meter-analog{display:block;width:116px;height:48px}
#meter-analog[hidden]{display:none}

#toolbar{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:31}
#ident{position:absolute;top:14px;left:14px;z-index:31;padding:6px 11px;font-size:11px;color:var(--dim)}
#ident b{color:var(--text);font-weight:600;letter-spacing:.04em}

#drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(370px,90%);z-index:45;
  transform:translateX(101%);transition:transform .22s ease;overflow-y:auto;padding:14px;
  border-radius:0;border-top:none;border-right:none;border-bottom:none;
}
#drawer.open{transform:none}
#drawer h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--live)}
#drawer .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
#drawer .close:hover{color:var(--text)}
.card{border:1px solid var(--rule);border-radius:var(--r);background:rgba(28,35,45,.6);margin-bottom:10px}
.card>.hd{padding:7px 10px;border-bottom:1px solid var(--rule)}
.card>.bd{padding:10px;display:flex;flex-direction:column;gap:9px}
.tele{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--rule)}
.tele div{background:var(--panel-2);padding:6px 9px;display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.tele span:first-child{color:var(--dim)}
.tele span:last-child{font-family:var(--mono)}
.card textarea.k{width:100%;font-family:var(--ui);resize:vertical}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div id="display-area"></div>

  <div id="ident" class="glass"><b>ON8ST</b> <span id="ident-fe"></span></div>
  <div id="toolbar">
    <button class="k mini" id="rare-things" title="Telemetry, behaviour, export, notes">⋯</button>
  </div>

  <div id="dockslot">
    <div id="instrument" class="glass">
      <div class="sgm" id="sgm-sdr" hidden><span class="cap">SDR</span><span class="val sm" id="v-sdr">—</span></div>
      <div class="sgm" id="sgm-mem"><span class="cap">Mem</span><span class="val" id="v-mem">—</span></div>
      <div class="sgm" id="sgm-band"><span class="cap">Band</span><span class="val" id="v-band">—</span></div>

      <div class="sgm freq">
        <span class="cap">Frequency · click above or below a digit</span>
        <div style="display:flex;align-items:stretch">
          <div class="digits" id="vfo-digits"></div>
          <div class="spin" id="spin">
            <button class="sar" id="step-up" title="Up one step">▲</button>
            <button class="sval" id="step-value">1 kHz</button>
            <button class="sar" id="step-down" title="Down one step">▼</button>
          </div>
        </div>
      </div>

      <div class="sgm" id="sgm-mode"><span class="cap">Mode</span><span class="val" id="tuned-mode">—</span></div>
      <div class="sgm" id="sgm-meter">
        <span class="cap" id="fe-power">—</span>
        <div class="minibar" id="meter-bar"><i style="width:0%"></i></div>
        <canvas id="meter-analog" width="116" height="48" hidden></canvas>
      </div>
      <div class="sgm" id="sgm-audio"><span class="cap">Audio</span><span class="val" id="audio-state">Off</span></div>
    </div>
  </div>

  <aside id="drawer" class="glass">
    <button class="close" id="drawer-close" aria-label="Close">×</button>
    <h3>Station</h3>
    <div class="card"><div class="hd"><span class="silk">Receiver telemetry</span></div>
      <div class="tele" id="tele"></div>
    </div>
    <div class="card"><div class="hd"><span class="silk">Behaviour</span></div>
      <div class="bd">
        <label class="chk"><input type="checkbox" id="pause-toggle"> Pause display updates</label>
      </div>
    </div>
    <div class="card"><div class="hd"><span class="silk">Spectrum display</span></div>
      <div class="bd">
        <div class="prow"><span class="cap" style="min-width:52px">Zoom</span><input type="range" id="zoom-level" min="0" max="15" value="0" style="flex:1"><button class="k mini" id="zoom-out">Out</button><button class="k mini" id="zoom-in">In</button><button class="k mini" id="zoom-center">Center</button></div>
        <div class="prow"><span class="cap" style="min-width:52px">Size</span><button class="k mini" id="spectrum-size-down">Smaller</button><button class="k mini" id="spectrum-size-up">Larger</button></div>
        <div class="prow"><span class="cap" style="min-width:52px">Range</span><button class="k mini" id="range-autoscale">Autoscale</button><button class="k mini" id="baseline-down">Floor −</button><button class="k mini" id="baseline-up">Floor +</button><button class="k mini" id="range-dec">Ceil −</button><button class="k mini" id="range-inc">Ceil +</button></div>
        <div class="prow"><span class="cap" style="min-width:52px">Colormap</span><select class="k" id="colormap-select"></select><input type="number" class="k num" id="waterfall-bias" step="1" title="Waterfall bias, decrease to lighten"></div>
      </div>
    </div>
    <div class="card"><div class="hd"><span class="silk">FFT &amp; hold</span></div>
      <div class="bd">
        <div class="prow"><span class="cap" style="min-width:90px">Trace averaging</span><input type="number" class="k num" id="fft-avg" min="1" max="50" step="1" title="Client-side trace smoothing"></div>
        <div class="prow"><span class="cap" style="min-width:90px">FFT averaging</span><input type="number" class="k num" id="spectrum-avg" min="1" max="150" step="1" title="Server-side FFT averaging"><button class="k mini" id="spectrum-avg-send">Send</button></div>
        <div class="prow"><label class="chk"><input type="checkbox" id="max-hold-enable"> Max/min hold</label></div>
        <div class="prow">
          <label class="chk"><input type="checkbox" id="show-live" checked> Live</label>
          <label class="chk"><input type="checkbox" id="show-max"> Max</label>
          <label class="chk"><input type="checkbox" id="show-min"> Min</label>
          <label class="chk"><input type="checkbox" id="freeze-min-max"> Freeze</label>
        </div>
        <div class="prow"><span class="cap" style="min-width:90px">Max decay</span><select class="k" id="hold-decay">
          <option value="1">Infinite</option><option value="1.0001">1.0001</option><option value="1.0005">1.0005</option>
          <option value="1.001">1.001</option><option value="1.005">1.005</option><option value="1.01">1.01</option>
          <option value="1.05">1.05</option><option value="1.1">1.1</option>
        </select></div>
        <div class="prow"><span class="cap" style="min-width:90px">Window</span><select class="k" id="window-type">
          <option value="KAISER_WINDOW">Kaiser</option><option value="RECT_WINDOW">Rectangular</option>
          <option value="BLACKMAN_WINDOW">Blackman</option><option value="EXACT_BLACKMAN_WINDOW">Exact Blackman</option>
          <option value="GAUSSIAN_WINDOW">Gaussian</option><option value="HANN_WINDOW">Hann</option>
          <option value="HAMMING_WINDOW">Hamming</option><option value="BLACKMAN_HARRIS_WINDOW">Blackman-Harris</option>
          <option value="HP5FT_WINDOW">HP5FT</option>
        </select><input type="number" class="k num" id="window-param" step="0.1" min="0" max="15" title="Kaiser beta / Gaussian alpha"><button class="k mini" id="window-send">Send</button></div>
        <div class="prow"><span class="cap" style="min-width:90px">FFT overlap</span><input type="number" class="k num" id="spectrum-overlap" step="0.01" min="0" max="0.99"><button class="k mini" id="spectrum-overlap-send">Send</button></div>
        <div class="prow"><span class="cap" style="min-width:90px">Poll rate (ms)</span><input type="number" class="k num" id="spectrum-poll" min="30" max="2000" step="10" value="100"><button class="k mini" id="spectrum-poll-send">Send</button></div>
      </div>
    </div>
    <div class="card"><div class="hd"><span class="silk">Data &amp; notes</span></div>
      <div class="bd">
        <div class="prow"><button class="k mini" id="export-csv">Download current spectrum (CSV)</button></div>
        <textarea class="k" id="notes-text" rows="3" placeholder="Notes"></textarea>
      </div>
    </div>
  </aside>
</div>

<script src="../pcm-player.js"></script>
<script src="../opus-decoder.min.js"></script>
<script src="../colormap.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
