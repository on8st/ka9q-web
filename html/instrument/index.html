<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ka9q-web instrument</title>
<style>
  /* "The receiver fills the screen... nothing floats over them" +
     "One control block, docked below the display... its height is its
     own; the display takes what remains." (design brief section 4) */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #111; color: #ddd; font-family: sans-serif; overflow: hidden; }

  #display-area {
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 0.9rem;
  }

  #control-block {
    flex: 0 0 auto;
    background: #111;
    border-top: 1px solid #333;
    padding: 1rem 2rem;
    max-width: 44rem;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
    max-height: 70vh;
    overflow-y: auto;
  }

  h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  dl { display: grid; grid-template-columns: 10rem 1fr; gap: 0.4rem 1rem; margin: 1rem 0; }
  dt { color: #888; }
  dd { margin: 0; }
  input { background: #222; color: #ddd; border: 1px solid #444; padding: 0.3rem; }
  button { padding: 0.3rem 0.8rem; }
  ul { padding-left: 1.2rem; }
  a { color: #6cf; }

  .vfo-digits {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 2.2rem;
    letter-spacing: 0.05em;
    user-select: none;
  }
  .vfo-digit {
    display: inline-block;
    width: 1.1ch;
    text-align: center;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 3px;
    cursor: pointer;
  }
  .vfo-digit:hover { background: #222; }
  .vfo-sep { display: inline-block; width: 0.4ch; }
  .vfo-hint { color: #888; font-size: 0.8rem; margin: 0.3rem 0 1rem; }

  .value-anchor { cursor: pointer; border-bottom: 1px dotted #666; }
  .value-anchor:hover { border-bottom-color: #6cf; }
  .value-panel {
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0.4rem;
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: 0.3rem;
    z-index: 10;
  }
  .value-panel button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 3px; }
  .value-panel button:hover { background: #333; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
  .chips button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 12px; padding: 0.2rem 0.7rem; }
  .chips button:hover { background: #333; }
  .memory-chip { display: inline-flex; }
  .memory-chip button[data-recall] { border-radius: 12px 0 0 12px; }
  .memory-delete { border-radius: 0 12px 12px 0 !important; border-left: none !important; color: #a55; }

  .meter-bar-track { width: 12rem; height: 0.8rem; background: #222; border: 1px solid #444; border-radius: 3px; }
  .meter-bar-fill { height: 100%; background: #6c6; border-radius: 2px; }
  .meter-analog { display: block; }
</style>
</head>
<body>

<div id="display-area">Spectrum/waterfall display - not built yet</div>

<div id="control-block">
  <h1>ka9q-web instrument</h1>
  <p id="status-line">Connection: <span id="conn-state">connecting…</span></p>

  <dl>
    <dt>Front end</dt><dd id="fe-desc">—</dd>
    <dt>Coverage</dt><dd id="fe-coverage">—</dd>
    <dt>Signal (IF power) <span id="meter-settings" class="value-anchor" title="Meter style">⚙</span></dt><dd id="fe-power">—</dd>
    <dt>Tuned frequency</dt><dd id="tuned-freq">—</dd>
    <dt>Mode</dt><dd id="tuned-mode">—</dd>
  </dl>

  <div id="vfo-digits" class="vfo-digits"></div>
  <p class="vfo-hint">Click the upper half of a digit to raise it, the lower half to lower it (Hz).</p>

  <p>
    Step: <button type="button" id="step-down">▼</button>
    <span id="step-value" class="value-anchor">1 kHz</span>
    <button type="button" id="step-up">▲</button>
  </p>

  <form id="tune-form">
    <label>Or type an exact frequency (kHz): <input id="tune-input" type="text" inputmode="decimal" size="12"></label>
    <button type="submit">Tune</button>
  </form>

  <div class="chips" id="band-chips"></div>

  <h2>Memories</h2>
  <div class="chips" id="memory-chips"></div>
  <button type="button" id="memory-save">Save current frequency</button>

  <div id="switcher" hidden>
    <h2>Other receivers on this station</h2>
    <ul id="switcher-list"></ul>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
