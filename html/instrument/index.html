<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ka9q-web instrument (scaffolding)</title>
<style>
  body { background: #111; color: #ddd; font-family: sans-serif; padding: 2rem; }
  code { background: #222; padding: 0.15rem 0.4rem; border-radius: 3px; }
</style>
</head>
<body>
<h1>ka9q-web instrument UI</h1>
<p>Scaffolding only - this proves the new interface can be served from
<code>/instrument/</code> alongside the stock page at <code>/</code>, with
neither the stock page, its scripts, nor the C server modified. No receiver
functionality lives here yet.</p>
<p id="status">Checking for sibling receivers...</p>
<script>
fetch('instances.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    document.getElementById('status').textContent =
      'Discovered instances.json: ' + JSON.stringify(data);
  })
  .catch(err => {
    document.getElementById('status').textContent =
      'instances.json not available yet (' + err.message + ') - discovery is a later step.';
  });
</script>
</body>
</html>
